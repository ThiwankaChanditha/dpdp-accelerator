#
# Deployment settings consumed by bin/configure.sh.

# Hostname and port clients use to reach the Identity Server.
IS_HOSTNAME=localhost
IS_PORT=9443

# Identity Server administrator. Substituted into the shipped deployment.toml
# template only. It is never stored in the portal's runtime configuration.
IS_ADMIN_USERNAME=admin@wso2.com
IS_ADMIN_PASSWORD=wso2123

# The deployment.toml configure.sh installs. It is a complete file that REPLACES
# the one in the product, not a fragment merged into it. To support a different
# Identity Server version, add a template beside this one and point this at it.
PRODUCT_CONF_PATH=repository/resources/wso2is-7.3.0-deployment.toml

# Database type for both the Identity Server's own database (WSO2IDENTITY_DB)
# and the DPDP database (WSO2DPDP_DB) - kept as one setting since
# the two must be kept in sync.
# One of: h2, mysql, postgresql, mssql, oracle, db2.
DB_TYPE=h2

# Adds IS's own consent-mgt v2 tables to WSO2IDENTITY_DB. Set to false if
# you've already applied it, or the database is managed elsewhere.
APPLY_IS_CONSENT_MGT_V2_MIGRATION=true

# Set false to skip the DPDP schema migration.
APPLY_DPDP_DB_MIGRATION=true
